name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
env:
  BUILD_VERSION: 1.${{ github.run_number }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build web part
        run: |
          export BUILD_DATE=$(date -u +%F)
          python3 build.py
      - run: npm install
      - run: npx cap add android
      - name: Tarazi icons and splash
        run: |
          cp -r resources/android/res/. android/app/src/main/res/
          find android/app/src/main/res -name 'splash.png' -exec cp resources/splash.png {} \;
      - name: Version code and name
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$BUILD_VERSION\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - run: npx cap sync android
      - name: Check signing secrets
        id: sign
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "enabled=$([ -n "$KS" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        if: steps.sign.outputs.enabled != 'yes'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Build signed release APK
        if: steps.sign.outputs.enabled == 'yes'
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tarazi.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          mkdir -p app/build/outputs/apk/signed
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/tarazi.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out app/build/outputs/apk/signed/Tarazi-${BUILD_VERSION}.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify app/build/outputs/apk/signed/Tarazi-${BUILD_VERSION}.apk
          rm -f "$RUNNER_TEMP/tarazi.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: tarazi-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/signed/*.apk
          if-no-files-found: error

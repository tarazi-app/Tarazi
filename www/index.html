<title>Tarazi</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<style>
/* Мобильный журнал: холодный светлый фон (светлая тема по умолчанию, тёмная и «как в системе» переключаются),
   тёмно-синие плитки и кнопки, бирюзовая рамка взвешивания, цвет карточки машины выбирает оператор.
   Экраны: смены → смена (машины по маршрутам) → машина; справочник; сводка за период. */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface-2:#EEF1F6; --ink:#0F172A; --ink-2:#64748B; --line:#E2E8F0;
  --navy:#141B2D; --navy-ink:#FFFFFF;
  --accent:#0F766E; --accent-ink:#FFFFFF; --accent-line:#8FD6CC;
  --car:#F97316; --car-ink:#FFFFFF;
  --ok:#15803D; --ok-soft:#DDF5E6;
  --bad:#C62828; --bad-soft:#FDECEA; --bad-solid:#C62828; --bad-solid-ink:#FFFFFF;
  --scrim:rgba(10,16,30,.5); --shadow:0 1px 3px rgba(15,23,42,.08);
  --font-ui:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1020; --surface:#131A2B; --surface-2:#1B2438; --ink:#E8EDF7; --ink-2:#93A0B8; --line:#243049;
    --navy:#222E4B; --accent:#2DD4BF; --accent-ink:#04201D; --accent-line:#2B6F68;
    --car:#FB923C; --ok:#4ADE80; --ok-soft:#12301F;
    --bad:#FF8F85; --bad-soft:#3A1F1D; --bad-solid:#F2766D; --bad-solid-ink:#1E0705;
    --scrim:rgba(0,0,0,.65); --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1020; --surface:#131A2B; --surface-2:#1B2438; --ink:#E8EDF7; --ink-2:#93A0B8; --line:#243049;
  --navy:#222E4B; --accent:#2DD4BF; --accent-ink:#04201D; --accent-line:#2B6F68;
  --car:#FB923C; --ok:#4ADE80; --ok-soft:#12301F;
  --bad:#FF8F85; --bad-soft:#3A1F1D; --bad-solid:#F2766D; --bad-solid-ink:#1E0705;
  --scrim:rgba(0,0,0,.65); --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font:15px/1.5 var(--font-ui);
  padding-block:8px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body.modal-open{overflow:hidden}
.app{max-width:720px;margin:0 auto}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(22px,5.5vw,28px);line-height:1.2;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:19px;line-height:1.25;font-weight:600}
button{font-family:inherit}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2);font-size:13px}
.ic{width:20px;height:20px;flex:none}
.ic--sm{width:17px;height:17px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* app bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px;margin-bottom:12px}
.appbar__l,.appbar__r{display:flex;align-items:center;gap:6px;min-width:0}
.appbar__l{gap:12px}
.logo{font-weight:700;font-size:22px;letter-spacing:-.01em;color:var(--ink)}
.tile{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:14px;background:var(--navy);color:var(--navy-ink);flex:none}
.tile--car{background:var(--car);color:var(--car-ink)}
.tile .ic{width:24px;height:24px}
@media (max-width:440px){.logo-tile{display:none}}
.sq{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;box-shadow:var(--shadow);flex:none}
.sq:hover{border-color:var(--ink-2)}
.sq--navy{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.sq--ghost{background:transparent;border-color:transparent;box-shadow:none}
.sq--ghost:hover{background:var(--surface-2);border-color:transparent}

/* buttons */
.btn{font:500 14px/1 var(--font-ui);min-height:42px;padding:0 16px;border:0;border-radius:12px;background:var(--surface-2);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{background:var(--line)}
.btn--primary{background:var(--navy);color:var(--navy-ink)}
.btn--primary:hover{background:var(--navy);filter:brightness(1.2)}
.btn--ghost{background:transparent;color:var(--ink-2)}
.btn--ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn--danger{color:var(--bad)}
.btn--danger:hover{background:var(--bad-soft);color:var(--bad)}
.btn--solid-danger{background:var(--bad-solid);color:var(--bad-solid-ink)}
.btn--solid-danger:hover{background:var(--bad-solid);filter:brightness(1.06)}
.btn--sm{min-height:36px;padding:0 12px;font-size:13px}
.btn--add{width:100%;min-height:54px;font-size:22px;font-weight:500;background:var(--accent);color:var(--accent-ink);border-radius:12px}
.btn--add:hover{background:var(--accent);filter:brightness(1.08)}
.btn--add.is-idle{opacity:.45}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--ink-2);cursor:pointer;flex:none}
.ibtn:hover{background:var(--surface-2);color:var(--ink)}
.ibtn--danger{color:var(--bad)}
.ibtn--danger:hover{background:var(--bad-soft);color:var(--bad)}
.linkbtn{border:0;background:none;padding:4px 0;color:var(--accent);font:500 13px var(--font-ui);cursor:pointer}
.linkbtn:hover{text-decoration:underline}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.empty{margin-top:20px;padding:36px 20px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:14px}
.empty .row-btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.note{margin:0 0 12px;padding:10px 14px;border-radius:12px;background:var(--surface-2);color:var(--ink-2);font-size:13px}
.badge{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:8px;font-size:13px;font-weight:500;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.badge--ok{background:var(--ok-soft);color:var(--ok)}
.badge--outline{background:var(--surface);border:1px solid var(--line);color:var(--ink);font-family:var(--font-mono);font-size:12.5px}

/* home */
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border:0;border-radius:999px;background:transparent;color:var(--ink-2);font:500 15px var(--font-ui);cursor:pointer}
.pill:hover{color:var(--ink)}
.pill.is-on{background:var(--navy);color:var(--navy-ink)}
.search{position:relative;margin:12px 0 16px}
.search .ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--ink-2);pointer-events:none}
.search .inp{padding-left:46px;min-height:50px;border-radius:14px}
.scards{display:flex;flex-direction:column;gap:12px}
.scard{display:block;padding:18px;color:inherit;text-decoration:none}
.scard:hover{border-color:var(--ink-2)}
.scard__top{display:flex;align-items:flex-start;gap:14px}
.scard__main{flex:1;min-width:0}
.scard__date{font-size:20px;font-weight:600;line-height:1.25}
.scard__sub{color:var(--ink-2)}
.scard__foot{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:14px;color:var(--ink-2)}
.scard__foot span{display:inline-flex;align-items:center;gap:8px;min-width:0}

/* shift screen */
.shiftcard{padding:20px}
.shiftcard__top{display:flex;align-items:center;gap:14px}
.shiftcard__row{display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--ink-2)}
.shiftcard__st{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:14px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}
.tiles--4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:520px){.tiles--4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tcell{background:var(--surface-2);border-radius:14px;padding:14px 8px;text-align:center;min-width:0}
.tcell .ic{color:var(--ink-2)}
.tcell__v{font-size:clamp(15px,4.6vw,22px);font-weight:600;line-height:1.2;margin-top:6px;white-space:nowrap}
.tcell__l{font-size:13px;color:var(--ink-2)}
.sect{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin:28px 0 12px}
.rgroup{display:flex;align-items:center;gap:10px;margin:18px 0 10px;font-weight:600}
.rgroup .ic{color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:8px;background:var(--surface-2);color:var(--ink);font-size:13px;font-weight:500;white-space:nowrap}
.ccard{display:block;padding:16px 16px 16px 18px;margin-bottom:12px;color:inherit;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--car);border-radius:16px;box-shadow:var(--shadow)}
.ccard:hover{border-color:var(--ink-2)}
.ccard__top{display:flex;align-items:center;gap:14px}
.ccard__top .tile{width:52px;height:52px;border-radius:14px}
.ccard__id{flex:1;min-width:0}
.ccard__line{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px}
.ccard__route{margin-left:auto;font-weight:700;text-align:right;overflow-wrap:anywhere}
.ccard__driver{margin-top:2px;color:var(--ink-2);overflow-wrap:anywhere}
.ccard__name{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.ccard__net{margin-top:14px}
.ccard__net b{display:block;font-size:26px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.ccard__facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;margin-top:12px;color:var(--ink-2)}
.ccard__facts span{display:inline-flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere}
.ccard__foot{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}

/* summary */
.summary{margin-top:36px}
.summary h2,.sect2{margin:28px 0 12px}
.summary h2{margin-top:0}
.summary h3{margin:24px 0 10px;color:var(--ink-2);font-weight:500;font-size:15px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-weight:500;font-size:13px;color:var(--ink-2);text-align:left;padding:12px 12px;background:var(--surface-2);white-space:nowrap}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl th:first-child,.tbl td:first-child{padding-left:18px}
.tbl .r{text-align:right}
.tbl .acts{white-space:nowrap;text-align:right;padding:2px 8px}
.tbl--trips{min-width:360px}
.tbl--sum{min-width:560px}
.tbl--per{min-width:460px}
.tbl tfoot td{font-weight:600;border-bottom:0}
.net{font-weight:600;color:var(--ok)}
.is-bad,.net.is-bad{color:var(--bad)}
.td-empty{color:var(--ink-2);text-align:center;padding:22px 12px!important}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:baseline}
.range{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* car screen */
.carcard{padding:20px}
.carcard__top{display:flex;align-items:center;gap:14px}
.carcard__id{flex:1;min-width:0}
.carcard__name{font-size:clamp(17px,5.2vw,20px);font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px;margin:16px 0 0;padding:0;list-style:none;color:var(--ink-2)}
.facts li{display:flex;align-items:center;gap:10px;min-width:0;overflow-wrap:anywhere}
.netbox{margin-top:18px;padding:18px 20px;border-radius:16px;background:var(--navy);color:var(--navy-ink)}
.netbox__label{font-size:14px;color:rgba(255,255,255,.72)}
.netbox__val{font-size:clamp(32px,9vw,42px);font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.netbox__sub{font-size:13px;color:rgba(255,255,255,.72)}
.weigh{margin-top:16px;padding:20px;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:2px dashed var(--accent-line);border-radius:18px}
.weigh h2{margin-bottom:2px}
.calc{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;padding:0 4px}
.calc:empty{display:none}
.calc__label{color:var(--ink-2);font-size:13px;letter-spacing:.04em}
.calc__val{font-size:20px;font-weight:600;color:var(--ok)}
.calc__val.is-bad{color:var(--bad)}
.calc__warn{flex:1 1 100%;color:var(--bad);font-size:13px}
.trips{margin-top:16px;overflow:hidden}
.trips__head{display:flex;align-items:baseline;justify-content:space-between;padding:20px 20px 14px}

/* glossary */
.lead{color:var(--ink-2);margin-top:8px;max-width:60ch}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:20px;border-bottom:1px solid var(--line)}
.tab{font:500 14px/1 var(--font-ui);color:var(--ink-2);background:none;border:0;border-bottom:2px solid transparent;padding:0 12px;margin-bottom:-1px;min-height:46px;cursor:pointer;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.tab:hover{color:var(--ink)}
.tab.is-on{color:var(--ink);border-bottom-color:var(--accent)}
.tab__n{font:500 12px var(--font-mono);color:var(--ink-2);background:var(--surface-2);border-radius:999px;padding:3px 8px}
.addrow{display:flex;gap:8px;margin-top:20px}
.addrow .inp{flex:1;min-width:0}
.filter{margin-top:12px}
.glist{list-style:none;margin:16px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.gitem{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px;padding:6px 8px 6px 20px}
.gitem+.gitem{border-top:1px solid var(--line)}
.gitem__name{flex:1 1 200px;min-width:0;font-weight:500;overflow-wrap:anywhere;padding:8px 0}
.gitem__use{color:var(--ink-2);font-size:13px}
.gitem__act{display:flex;gap:2px}
.hint{margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;color:var(--ink-2);font-size:13px}

/* inputs */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lbl{font-size:13px;font-weight:500;color:var(--ink-2)}
.field__lbl{display:flex;align-items:center;justify-content:space-between;gap:8px}
.inp{width:100%;min-height:48px;padding:0 14px;font:16px/1.2 var(--font-ui);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px}
select.inp{padding-right:8px}
.inp--xl{min-height:54px}
.inp:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.inp[aria-invalid="true"]{border-color:var(--bad)}
.sws{display:flex;flex-wrap:wrap;gap:10px;padding:4px}
.sw{position:relative;width:40px;height:40px;cursor:pointer}
.sw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.sw span{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:12px;background:var(--c);color:#fff;font-size:18px;font-weight:700;line-height:1}
.sw input:checked+span{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.sw input:checked+span::after{content:"✓"}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:6px}

.shiftcard__acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* dialogs */
.overlay{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{width:100%;max-width:500px;margin:auto 0;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px}
.dlg-title{margin-bottom:16px}
.dlg-text,.dlg-note{color:var(--ink-2);overflow-wrap:anywhere}
.dlg-note{margin-top:12px;font-size:13px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fields .field{grid-column:1/-1}
.fields .field--half{grid-column:auto}
@media (max-width:440px){.fields .field--half{grid-column:1/-1}}
.field .inp+.inp{margin-top:2px}
.err{color:var(--bad);font-size:13px}
.fhint{color:var(--ink-2);font-size:13px;margin-top:10px}
.dlg-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:22px}
.dlg-del{margin-right:auto}
.langsel{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px 0}
.langsel .logo-tile{width:64px;height:64px}
.langsel h1{margin:6px 0 0;font-size:32px}
.langsel__btns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px;margin-top:18px}
.btn--lg{min-height:56px;font-size:18px;justify-content:center}

/* phone layout */
.tbl--stack td[data-l=""]::before{display:none}
@media (max-width:600px){
  .tbl td,.tbl th{padding-left:8px;padding-right:8px}
  .tbl th:first-child,.tbl td:first-child{padding-left:12px}
  .tbl--stack,.tbl--stack.tbl--sum,.tbl--stack.tbl--per{min-width:0}
  .tbl--stack thead{display:none}
  .tbl--stack,.tbl--stack tbody,.tbl--stack tfoot,.tbl--stack tr{display:block}
  .tbl--stack tr{padding:10px 16px;border-bottom:1px solid var(--line)}
  .tbl--stack tbody tr:last-child{border-bottom:0}
  .tbl--stack td,.tbl--stack td:first-child{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:3px 0;border:0;text-align:right;overflow-wrap:anywhere}
  .tbl--stack td::before{content:attr(data-l);flex:none;color:var(--ink-2);font:400 13px var(--font-ui);text-align:left}
  .tbl--stack td[colspan]{justify-content:flex-start;font-weight:600}
  .tbl--stack tfoot tr{background:var(--surface-2)}
  .tbl--trips{min-width:0}
  .tbl--trips td,.tbl--trips th{padding-left:6px;padding-right:6px}
  .tbl--trips .acts{padding:2px 2px}
  .overlay{align-items:flex-end;padding:16px 0 0}
  .dialog{margin:0;max-width:none;max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px);overflow-y:auto;overscroll-behavior:contain;border-radius:20px 20px 0 0;border-bottom:0;
    padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px))}
  .dlg-actions{position:sticky;bottom:0;margin:16px -16px calc(-16px - env(safe-area-inset-bottom,0px));padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
  .dlg-actions .btn{flex:1 1 auto;justify-content:center}
  .xgrid{gap:8px}
}
@media (max-width:400px){
  .tbl--trips td{font-size:13.5px}
  .tbl--trips td,.tbl--trips th{padding-left:4px;padding-right:4px}
  .tbl--trips th{font-size:12px}
  .tbl--trips th:first-child,.tbl--trips td:first-child{padding-left:10px}
  .tbl--trips .ibtn{width:36px;height:36px}
  .langsel .logo-tile{display:inline-flex}
}
.xgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.xbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:left;font:inherit}
.xbtn:last-child:nth-child(odd){grid-column:1/-1}

const fmt=(n,d=2)=>Number(n||0).toLocaleString(LOC(),{maximumFractionDigits:d});
const r2=n=>Math.round(n*100)/100;
const pad=n=>String(n).padStart(2,'0');

/* время вводится цифрами: 0726 → 07:26, 726 → 07:26, 14 → 14:00 */
function normTime(s){
  const d=String(s||'').replace(/\D/g,'');
  if(!d||d.length>4)return '';
  let h,m;
  if(d.length<=2){h=+d;m=0;}else if(d.length===3){h=+d[0];m=+d.slice(1);}else{h=+d.slice(0,2);m=+d.slice(2);}
  return h>23||m>59?'':pad(h)+':'+pad(m);
}
function fmtTimeLive(v){
  const d=String(v||'').replace(/\D/g,'').slice(0,4);
  if(d.length<=2)return d;
  let h=d.slice(0,2),m=d.slice(2);
  if(+h>23){h='0'+d[0];m=d.slice(1,3);}
  return h+':'+m;
}
function plural(n,f){const a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return f[2];if(b>1&&b<5)return f[1];if(b===1)return f[0];return f[2];}
function parseNum(s){const t=String(s==null?'':s).replace(/[\s  ]/g,'').replace(',','.');if(t==='')return NaN;const n=Number(t);return isFinite(n)?n:NaN;}
function parseDate(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null;}
function dateLong(s){const d=parseDate(s);if(!d)return s||tx("без даты");if(LANG==='kk')return d.getDate()+' '+KK_MONTHS[d.getMonth()]+' '+d.getFullYear();return d.toLocaleDateString(LOC(),{day:'numeric',month:'long',year:'numeric'});}
function dateShort(s){const d=parseDate(s);if(!d)return s||tx("без даты");if(LANG==='kk')return d.getDate()+' '+KK_MONTHS[d.getMonth()];return d.toLocaleDateString(LOC(),{day:'numeric',month:'long'});}
function dateRu(s){const d=parseDate(s);return d?pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear():(s||'');}
function stable(v){return JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.keys(x).sort().reduce((o,kk)=>(o[kk]=x[kk],o),{}):x);}
function safeName(s){return String(s).replace(/[\\\/:*?"<>|]+/g,'-').replace(/\s+/g,'_');}
const newestFirst=(a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0);

const shiftLabelRu=t=>t==='night'?'2-ночная':'1-дневная';
const shiftName=sh=>tx(shiftLabelRu(sh&&sh.type));
function normalize(v,id){
  const sh=plain(v);
  sh.id=id;sh.date=sh.date||'';sh.shift=sh.shift||'';sh.operator=sh.operator||'';sh.createdAt=sh.createdAt||0;
  sh.type=(sh.type==='night'||sh.type==='day')?sh.type:(/ноч/i.test(sh.shift)?'night':'day');
  sh.status=sh.status==='closed'?'closed':'active';
  sh.cars=Array.isArray(sh.cars)?sh.cars:[];
  sh.cars.forEach(c=>{
    c.trips=Array.isArray(c.trips)?c.trips:[];c.tare=Number(c.tare)||0;
    c.color=COLORS.some(k=>k.id===c.color)?c.color:'orange';
    c.trips.forEach(t=>{t.gross=Number(t.gross)||0;});
  });
  return sh;
}
function normGloss(v){
  const g=emptyGloss();
  CATS.forEach(c=>{
    const a=v&&Array.isArray(v[c.id])?v[c.id]:[];
    a.forEach(x=>{if(x&&typeof x.name==='string'&&x.name.trim())g[c.id].push({id:String(x.id||uid('g')),name:x.name});});
  });
  return g;
}

/* ---------- glossary model ---------- */
const sameName=(a,b)=>String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase();
function cleanName(cat,s){let t=String(s||'').replace(/\s+/g,' ').trim();if(cat==='vehicles')t=t.toUpperCase();return t;}
function glossFind(cat,name){return S.glossary[cat].find(x=>sameName(x.name,name));}
function glossAdd(cat,name){
  const n=cleanName(cat,name);if(!n)return null;
  const ex=glossFind(cat,n);if(ex)return ex.name;
  S.glossary[cat].push({id:uid('g'),name:n});persistGlossary();return n;
}
function glossValue(cat,car){return {routes:car.route,vehicles:car.plate,drivers:car.driver,materials:car.material}[cat];}
function usageCount(cat,name){
  let n=0;
  Object.values(S.shifts).forEach(sh=>{
    if(cat==='operators'){if(sameName(sh.operator,name))n++;}
    else sh.cars.forEach(c=>{if(sameName(glossValue(cat,c),name))n++;});
  });
  return n;
}
function missingFromShifts(){
  const seen={},out=[];
  const add=(cat,v)=>{const n=cleanName(cat,v);if(!n)return;const k=cat+'|'+n.toLowerCase();if(seen[k]||glossFind(cat,n))return;seen[k]=1;out.push({cat,name:n});};
  Object.values(S.shifts).forEach(sh=>{
    add('operators',sh.operator);
    sh.cars.forEach(c=>{add('vehicles',c.plate);add('drivers',c.driver);add('routes',c.route);add('materials',c.material);});
  });
  return out;
}
function autoType(){const h=new Date().getHours();return h>=8&&h<20?'day':'night';}
function lastOperator(){const l=Object.values(S.shifts).sort(newestFirst)[0];return l?l.operator:'';}
function lastCarFor(plate){
  const list=Object.values(S.shifts).sort(newestFirst);
  for(const sh of list){for(let i=sh.cars.length-1;i>=0;i--){if(sameName(sh.cars[i].plate,plate))return sh.cars[i];}}
  return null;
}
function prevShift(sh){
  return Object.values(S.shifts).filter(x=>x.id!==sh.id&&x.cars.length).sort((a,b)=>((b.type===sh.type)-(a.type===sh.type))||newestFirst(a,b))[0]||null;
}

/* ---------- calculations ---------- */
function carStats(c){let gross=0,net=0;c.trips.forEach(t=>{gross+=t.gross;net+=t.gross-c.tare;});return{n:c.trips.length,gross:r2(gross),net:r2(net)};}
function shiftStats(sh){let trips=0,net=0,gross=0;sh.cars.forEach(c=>{const s=carStats(c);trips+=s.n;net+=s.net;gross+=s.gross;});return{cars:sh.cars.length,trips,net:r2(net),gross:r2(gross)};}
function groupStats(list,pick){
  const m={};
  list.forEach(sh=>sh.cars.forEach(c=>{
    const name=pick(c)||tx("Не указан"),k=name.trim().toLowerCase(),s=carStats(c);
    if(!m[k])m[k]={name,cars:0,trips:0,net:0};
    m[k].cars++;m[k].trips+=s.n;m[k].net=r2(m[k].net+s.net);
  }));
  return Object.values(m).sort((a,b)=>b.net-a.net);
}
const materialStats=sh=>groupStats([sh],c=>c.material);
function currentCar(){const sh=S.shifts[S.shiftId];return sh?sh.cars.find(c=>c.id===S.carId):null;}
function periodShifts(){return Object.values(S.shifts).filter(sh=>(!S.sFrom||sh.date>=S.sFrom)&&(!S.sTo||sh.date<=S.sTo)).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.createdAt||0)-(b.createdAt||0));}

/* ---------- storage ---------- */
function loadLocal(){try{const raw=localStorage.getItem(KEY);if(!raw)return{};const o=JSON.parse(raw);const out={};Object.keys(o).forEach(id=>{out[id]=normalize(o[id],id);});return out;}catch(e){return{};}}
function loadGlossLocal(){try{const raw=localStorage.getItem(GKEY);return raw?normGloss(JSON.parse(raw)):emptyGloss();}catch(e){return emptyGloss();}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S.shifts));localStorage.setItem(GKEY,JSON.stringify(S.glossary));}catch(e){}}
function enqueue(id,job){
  pending[id]=(pending[id]||0)+1;
  queues[id]=(queues[id]||Promise.resolve()).then(job).catch(err=>{
    const denied=err&&err.code==='invalid_argument';
    toast(denied?tx("Не удалось сохранить: у вас нет прав на изменение данных."):tx("Не удалось сохранить изменения. Повторите действие."),'err');
  }).then(()=>{pending[id]--;});
}
function persist(id){
  if(S.mode==='db'){enqueue(id,async()=>{const s=S.shifts[id];if(!s)return;await S.db.doc('shifts/'+id).set(plain(s));});}
  else saveLocal();
}
function persistDelete(id){
  if(S.mode==='db'){enqueue(id,async()=>{await S.db.doc('shifts/'+id).delete();});}
  else saveLocal();
}
function persistGlossary(){
  if(S.mode==='db'){enqueue('glossary',async()=>{await S.db.doc('glossary/main').set(plain(S.glossary));});}
  else saveLocal();
}
function mutateShift(id,fn){
  const cur=S.shifts[id];if(!cur)return;
  const next=plain(cur);fn(next);
  S.shifts[id]=next;persist(id);render();
}
function onSnap(snap){
  const next={};
  snap.docs.forEach(d=>{const v=d.data();if(v&&d.id)next[d.id]=normalize(v,d.id);});
  let changed=false;
  new Set(Object.keys(next).concat(Object.keys(S.shifts))).forEach(id=>{
    if(pending[id])return;
    const a=S.shifts[id],b=next[id];
    if(!b){if(a){delete S.shifts[id];changed=true;}return;}
    if(!a||stable(a)!==stable(b)){S.shifts[id]=b;changed=true;}
  });
  if(!S.gotShifts){S.gotShifts=true;changed=true;}
  if(changed)render();
}
function onGlossSnap(snap){
  let changed=false;
  if(!pending.glossary){
    const d=snap.exists?normGloss(snap.data()):emptyGloss();
    if(stable(d)!==stable(S.glossary)){S.glossary=d;changed=true;}
  }
  if(!S.gotGloss){S.gotGloss=true;changed=true;}
  if(changed)render();
}

function docToTxt(doc){

const RF='Onest, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
const RC={ink:'#0F172A',mute:'#64748B',head:'#334155',line:'#D9E0E7',fill:'#EEF1F6',accent:'#0F766E'};
const toBlob=(cv,type,q)=>new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error('blob')),type,q));
function wrapLines(ctx,text,maxW){
  text=String(text==null?'':text);if(!text)return [''];

    const t=line?line+' '+w:w;
    if(ctx.measureText(t).width<=maxW){line=t;continue;}
    if(line){out.push(line);line='';}
    let chunk='';
    for(const ch of w){if(chunk&&ctx.measureText(chunk+ch).width>maxW){out.push(chunk);chunk=ch;}else chunk+=ch;}
    line=chunk;
  }

}
function layoutDoc(doc,W){
  const M=40,cw=W-2*M,ctx=document.createElement('canvas').getContext('2d'),items=[];
  const F=(wt,sz)=>{ctx.font=wt+' '+sz+'px '+RF;};
  items.push({t:'title',h:64,text:doc.title});
  const half=cw/2;
  const blocks=doc.meta.map(([k,v])=>{F(700,14);const lines=wrapLines(ctx,v,half-16);return {k,lines,h:22+lines.length*19};});
  for(let i=0;i<blocks.length;i+=2){const pair=blocks.slice(i,i+2);items.push({t:'meta',pair,h:Math.max(...pair.map(b=>b.h))+6});}
  doc.tables.forEach(tb=>{
    const pad=9,all=[tb.head,...tb.rows,...(tb.foot?[tb.foot]:[])];
    const nat=tb.head.map((_,i)=>{let m=0;all.forEach((r,ri)=>{const bold=ri===0||(tb.foot&&r===tb.foot);F(bold?700:400,ri===0?12:13);m=Math.max(m,ctx.measureText(String(r[i]==null?'':r[i])).width);});return m+2*pad;});
    const sum=nat.reduce((a,b)=>a+b,0);
    let w;
    if(sum<=cw){w=nat.map(x=>x+(cw-sum)*(x/sum));}
    else{
      const mn=nat.map(x=>Math.min(x,64));
      w=nat.map((x,i)=>Math.max(mn[i],x*cw/sum));
      const total=w.reduce((a,b)=>a+b,0);
      if(total>cw){const flex=w.map((x,i)=>x-mn[i]),fs=flex.reduce((a,b)=>a+b,0)||1;w=w.map((x,i)=>x-(total-cw)*flex[i]/fs);}
    }
    const xs=[];let x=M;w.forEach(v=>{xs.push(x);x+=v;});
    const T={w,xs,pad,align:tb.align,boldLast:tb.boldLast};
    const mk=(cells,bold,head)=>{
      F(bold?700:400,head?12:13);
      const lines=cells.map((c,i)=>wrapLines(ctx,c,w[i]-2*pad)),lh=head?15:17;
      return {lines,lh,h:Math.max(...lines.map(l=>l.length))*lh+(head?14:12)};
    };
    items.push({t:'h2',h:42,text:tb.title});
    items.push(Object.assign({t:'thead',T},mk(tb.head,true,true)));
    tb.rows.forEach(r=>items.push(Object.assign({t:'trow',T},mk(r,false,false))));
    if(tb.foot)items.push(Object.assign({t:'tfoot',T},mk(tb.foot,true,false)));

}
function drawItem(ctx,it,y,L){
  const M=L.M,cw=L.cw;

  const hline=(yy,lw,col)=>{ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(M,yy);ctx.lineTo(M+cw,yy);ctx.stroke();};
  if(it.t==='title'){
    ctx.fillStyle=RC.ink;ctx.font='700 26px '+RF;ctx.fillText(it.text,M,y+28);
    ctx.fillStyle=RC.mute;ctx.font='400 12px '+RF;ctx.fillText('Tarazi · '+tx('сформировано')+' '+stamp(),M,y+47);
    hline(y+56,2,RC.ink);
  }else if(it.t==='meta'){
    it.pair.forEach((b,j)=>{
      const x=M+j*L.half;
      ctx.fillStyle=RC.mute;ctx.font='400 11.5px '+RF;ctx.fillText(b.k,x,y+12);
      ctx.fillStyle=RC.ink;ctx.font='700 14px '+RF;
      b.lines.forEach((ln,li)=>ctx.fillText(ln,x,y+31+li*19));
    });
  }else if(it.t==='h2'){
    ctx.fillStyle=RC.ink;ctx.font='700 17px '+RF;ctx.fillText(it.text,M,y+28);
  }else{
    const T=it.T,head=it.t==='thead',bold=head||it.t==='tfoot';
    if(head){ctx.fillStyle=RC.fill;ctx.fillRect(M,y,cw,it.h);}
    if(it.t==='tfoot')hline(y+0.75,1.5,RC.ink);
    else if(it.t==='trow')hline(y+it.h-0.5,1,RC.line);
    it.lines.forEach((lines,i)=>{
      const b=bold||(T.boldLast&&i===T.w.length-1);
      ctx.font=(b?'700 ':'400 ')+(head?12:13)+'px '+RF;
      ctx.fillStyle=head?RC.head:RC.ink;
      const right=T.align[i]==='r';
      ctx.textAlign=right?'right':'left';

      lines.forEach((ln,li)=>ctx.fillText(ln,x,y+(head?18:17)+li*it.lh));
    });
    ctx.textAlign='left';
  }
}
async function loadReportFonts(){

}
async function docToPng(doc){

  const H=L.M*2+L.items.reduce((a,i)=>a+i.h,0);
  const sc=Math.max(1,Math.min(2,Math.sqrt(14e6/(W*H))));
  const cv=document.createElement('canvas');cv.width=Math.round(W*sc);cv.height=Math.round(H*sc);
  const ctx=cv.getContext('2d');ctx.scale(sc,sc);ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,W,H);
  let y=L.M;L.items.forEach(it=>{drawItem(ctx,it,y,L);y+=it.h;});

}
function paginate(items,H,M){
  const bottom=H-M-14,pages=[[]];let y=M,pi=0,head=null;
  const np=()=>{pages.push([]);pi++;y=M;};
  const add=it=>{pages[pi].push({it,y});y+=it.h;};
  items.forEach((it,idx)=>{
    if(it.t==='title'||it.t==='meta'){if(y+it.h>bottom&&y>M)np();add(it);return;}
    if(it.t==='h2'){
      const need=it.h+(items[idx+1]?items[idx+1].h:0)+(items[idx+2]?items[idx+2].h:0);
      if(y+need>bottom&&y>M)np();add(it);return;
    }
    if(it.t==='thead'){head=it;add(it);return;}
    if(y+it.h>bottom){np();if(head)add(head);}
    add(it);
  });
  return pages;
}
function buildPdf(pages){
  const enc=new TextEncoder(),chunks=[],offs=[];let off=0;
  const push=b=>{chunks.push(b);off+=b.length;};
  const str=s=>push(enc.encode(s));
  const n=pages.length;
  str('%PDF-1.4\n');push(new Uint8Array([0x25,0xE2,0xE3,0xCF,0xD3,10]));
  const obj=(id,fn)=>{offs[id]=off;str(id+' 0 obj\n');fn();str('\nendobj\n');};
  obj(1,()=>str('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>str('<< /Type /Pages /Count '+n+' /Kids ['+pages.map((_,i)=>(3+3*i)+' 0 R').join(' ')+'] >>'));
  pages.forEach((p,i)=>{
    const pw=(p.w*0.75).toFixed(2),ph=(p.h*0.75).toFixed(2);
    obj(3+3*i,()=>str('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pw+' '+ph+'] /Resources << /XObject << /Im0 '+(5+3*i)+' 0 R >> >> /Contents '+(4+3*i)+' 0 R >>'));
    const cs='q '+pw+' 0 0 '+ph+' 0 0 cm /Im0 Do Q';
    obj(4+3*i,()=>str('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream'));
    obj(5+3*i,()=>{str('<< /Type /XObject /Subtype /Image /Width '+p.iw+' /Height '+p.ih+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+p.jpg.length+' >>\nstream\n');push(p.jpg);str('\nendstream');});
  });
  const total=3+3*n,xref=off;
  str('xref\n0 '+total+'\n0000000000 65535 f \n');
  for(let id=1;id<total;id++)str(String(offs[id]).padStart(10,'0')+' 00000 n \n');
  str('trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF');
  return new Blob(chunks,{type:'application/pdf'});
}
async function docToPdf(doc){
  await loadReportFonts();
  const land=doc.orient==='l',pw=land?1123:794,ph=land?794:1123,sc=2;
  const L=layoutDoc(doc,pw),pages=paginate(L.items,ph,L.M),out=[];
  for(let i=0;i<pages.length;i++){
    const cv=document.createElement('canvas');cv.width=pw*sc;cv.height=ph*sc;
    const ctx=cv.getContext('2d');ctx.scale(sc,sc);ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,pw,ph);
    pages[i].forEach(p=>drawItem(ctx,p.it,p.y,L));
    ctx.fillStyle=RC.mute;ctx.font='400 11px '+RF;ctx.textBaseline='alphabetic';
    ctx.textAlign='left';ctx.fillText('Tarazi',L.M,ph-22);
    ctx.textAlign='right';ctx.fillText((i+1)+' / '+pages.length,pw-L.M,ph-22);
    const blob=await toBlob(cv,'image/jpeg',0.92);
    out.push({w:pw,h:ph,iw:cv.width,ih:cv.height,jpg:new Uint8Array(await blob.arrayBuffer())});

    {name:'[Content_Types].xml',text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+sheets.map((_,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')+'<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'},
    {name:'_rels/.rels',text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:'xl/workbook.xml',text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook '+XNS+' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map((sh,i)=>'<sheet name="'+xe(sh.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+'</sheets></workbook>'},
    {name:'xl/_rels/workbook.xml.rels',text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((_,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')+'<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
    {name:'xl/styles.xml',text:xstyles()}
  ].concat(sheets.map((sh,i)=>({name:'xl/worksheets/sheet'+(i+1)+'.xml',text:sh.xml})));
  return zipStore(files);
}
async function buildExportFile(fmt,o){
  if(fmt==='csv'){const t=o.csv();return {name:o.base+'.csv',data:'﻿'+t,text:t};}
  if(fmt==='txt'){const t=docToTxt(o.doc());return {name:o.base+'.txt',data:'﻿'+t,text:t};}
  if(fmt==='png')return {name:o.base+'.png',data:await docToPng(o.doc())};
  if(fmt==='xlsx')return {name:o.base+'.xlsx',data:docToXlsx(o.doc())};
  return {name:o.base+'.pdf',data:await docToPdf(o.doc())};
}
async function deliver(name,data,text){
  if(!S.downloads){
    if(text!=null){closeModal();openExportFallback(name,text);}
    else toast(tx("В этом окне сохранение файлов недоступно. Откройте сайт в браузере."),'err');
    return false;
  }
  try{await S.downloads.save({filename:name,data});toast(tx("Файл сохранён: ")+name);return true;}
  catch(e){
    const code=e&&e.code;
    if(code==='declined')return false;
    if(code==='rate_limited'){toast(tx("Подождите секунду и повторите."),'err');return false;}
    if(text!=null){closeModal();openExportFallback(name,text);}
    else toast(tx("Не удалось сохранить файл."),'err');
    return false;
  }
}
async function runExport(fmt){
  const st=S.modal,o=st&&st.exp;if(!o||st.busy)return;
  st.busy=true;
  const btns=[...$modal.querySelectorAll('.xbtn')],msg=document.getElementById('x-status');
  btns.forEach(b=>{b.disabled=true;});
  if(msg){msg.textContent=tx("Готовлю файл…");msg.hidden=false;}
  try{
    const f=await buildExportFile(fmt,o);
    if(S.modal!==st)return;
    const ok=await deliver(f.name,f.data,f.text);
    if(ok&&S.modal===st)closeModal();
  }catch(e){toast(tx("Не удалось подготовить файл. Попробуйте другой формат."),'err');}
  finally{st.busy=false;if(S.modal===st){btns.forEach(b=>{b.disabled=false;});if(msg)msg.hidden=true;}}
}

function medianOf(a){const v=a.slice().sort((x,y)=>x-y),m=v.length>>1;return v.length%2?v[m]:(v[m-1]+v[m])/2;}
function refGross(car){
  const arr=car.trips.map(t=>t.gross);
  if(arr.length<3){
    const list=Object.values(S.shifts).sort(newestFirst);
    outer:for(const sh of list){for(const c of sh.cars){if(c.id===car.id||!sameName(c.plate,car.plate))continue;for(const t of c.trips){arr.push(t.gross);if(arr.length>=6)break outer;}}}
  }
  return arr.length?medianOf(arr):0;
}
function grossAnomaly(car,g){const ref=refGross(car);return ref&&Math.abs(g-ref)/ref>0.2?ref:0;}
function calcHtml(car,raw){
  const g=parseNum(raw);
  if(isNaN(g)||g<=0)return '';
  const n=r2(g-car.tare);
  const ref=n>=0?grossAnomaly(car,g):0;
  return `<span class="calc__label">${tx("НЕТТО:")}</span><span class="calc__val mono${n<0?' is-bad':''}">${fmt(n)} ${tx("кг")}</span>${n<0?tx("<span class=\"calc__warn\">Брутто меньше тары. Проверьте вес.</span>"):''}${ref?`<span class="calc__warn">${esc(tx('Обычно около {r} кг. Проверьте вес.',{r:fmt(ref,0)}))}</span>`:''}`;
}

  const E=entCurrent(list);
  const entHtml=`<h2 class="sect2">${tx("Отчёт по водителю или маршруту")}</h2><div class="range"><div class="field"><label for="ent-kind">${tx("Тип")}</label><select class="inp" id="ent-kind" data-ent="kind"><option value="driver"${E.kind==='driver'?' selected':''}>${tx("Водитель")}</option><option value="route"${E.kind==='route'?' selected':''}>${tx("Маршрут")}</option></select></div><div class="field"><label for="ent-name">${tx("Выбор")}</label><select class="inp" id="ent-name" data-ent="name">${E.names.map(n=>`<option value="${esc(n)}"${n===E.name?' selected':''}>${esc(n)}</option>`).join('')}</select></div></div><div style="margin-top:12px"><button class="btn btn--primary" data-act="entity-report"${E.names.length?'':' disabled'}>${icon('down','ic--sm')}${tx("Скачать отчёт")}</button></div>`;
  const tot=list.reduce((a,sh)=>{const s=shiftStats(sh);a.cars+=s.cars;a.trips+=s.trips;a.net=r2(a.net+s.net);return a;},{cars:0,trips:0,net:0});
  const rows=list.map(sh=>{const s=shiftStats(sh);
    return `<tr><td>${esc(dateRu(sh.date))}</td><td>${esc(shiftName(sh))}</td><td>${esc(sh.operator)}</td><td class="r mono">${s.cars}</td><td class="r mono">${s.trips}</td><td class="r mono net">${fmt(s.net)}</td></tr>`;}).join('');

    +`<h1>${tx("Сводка за период")}</h1>
    <p class="lead">${tx("Итоги по сменам, материалам, маршрутам и водителям. Отчёт выгружается в CSV для Excel.")}</p>
    <div class="range">
      <div class="field"><label for="sfrom">${tx("С даты")}</label><input class="inp" id="sfrom" type="date" value="${esc(S.sFrom)}" data-stat="from"></div>
      <div class="field"><label for="sto">${tx("По дату")}</label><input class="inp" id="sto" type="date" value="${esc(S.sTo)}" data-stat="to"></div>
    </div>
    <div class="chips"><button class="btn btn--sm" data-act="range" data-range="week">${tx("7 дней")}</button><button class="btn btn--sm" data-act="range" data-range="month">${tx("Этот месяц")}</button><button class="btn btn--sm" data-act="range" data-range="all">${tx("Всё время")}</button></div>
    <div class="tiles tiles--4">
      <div class="tcell">${icon('cal')}<div class="tcell__v">${list.length}</div><div class="tcell__l">${plural(list.length,[tx("Смена"),tx("Смены"),tx("Смен")])}</div></div>
      <div class="tcell">${icon('truck')}<div class="tcell__v">${tot.cars}</div><div class="tcell__l">${plural(tot.cars,[tx("Машина"),tx("Машины"),tx("Машин")])}</div></div>
      <div class="tcell">${icon('scale')}<div class="tcell__v">${tot.trips}</div><div class="tcell__l">${plural(tot.trips,[tx("Рейс"),tx("Рейса"),tx("Рейсов")])}</div></div>
      <div class="tcell">${icon('box')}<div class="tcell__v mono">${fmt(tot.net/1000,1)}</div><div class="tcell__l">${tx("т НЕТТО")}</div></div>
    </div>
    ${entHtml}
    ${list.length?`<h2 class="sect2">${tx("По сменам")}</h2><div class="box scroll"><table class="tbl tbl--sum tbl--stack"><thead><tr><th>${tx("Дата")}</th><th>${tx("Смена")}</th><th>${tx("Оператор")}</th><th class="r">${tx("Машин")}</th><th class="r">${tx("Рейсов")}</th><th class="r">${tx("Нетто, кг")}</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td colspan="3">${tx("Итого")}</td><td class="r mono">${tot.cars}</td><td class="r mono">${tot.trips}</td><td class="r mono net">${fmt(tot.net)}</td></tr></tfoot></table></div>`
      :tx("<div class=\"empty\"><p>За выбранный период смен нет.</p></div>")}
    ${perTable(tx("По материалам"),tx("Материал"),groupStats(list,c=>c.material))}
    ${perTable(tx("По маршрутам"),tx("Маршрут"),groupStats(list,c=>c.route))}
    ${perTable(tx("По водителям"),tx("Водитель"),groupStats(list,c=>c.driver))}
    <h2 class="sect2">${tx("Резервная копия")}</h2>
    <p class="lead" style="margin-top:0">${tx("Все смены и справочник одним файлом JSON. Храните его на случай, если данные понадобятся вне сайта.")}</p>
    <div style="margin-top:12px"><button class="btn" data-act="backup">${icon('down','ic--sm')}${tx("Скачать резервную копию")}</button></div>`;

function viewGlossary(){
  const cat=CATS.find(c=>c.id===S.gcat)||CATS[0];
  const items=S.glossary[cat.id].slice().sort((a,b)=>a.name.localeCompare(b.name,LOC()));
  const q=S.gfilter.trim().toLowerCase();
  const shown=q?items.filter(x=>x.name.toLowerCase().includes(q)):items;
  const miss=missingFromShifts();
  const tabs=CATS.map(c=>`<button class="tab${c.id===cat.id?' is-on':''}" role="tab" aria-selected="${c.id===cat.id}" data-act="gtab" data-cat="${c.id}">${c.label}<span class="tab__n">${S.glossary[c.id].length}</span></button>`).join('');
  const lis=shown.map(it=>{
    const n=usageCount(cat.id,it.name);
    const use=n?`${n} ${cat.id==='operators'?plural(n,[tx("смена"),tx("смены"),tx("смен")]):plural(n,[tx("бланк"),tx("бланка"),tx("бланков")])}`:tx("не используется");
    return `<li class="gitem"><span class="gitem__name${cat.id==='vehicles'?' mono':''}">${esc(it.name)}</span><span class="gitem__use">${use}</span>
      <span class="gitem__act"><button class="ibtn" data-act="gloss-edit" data-id="${esc(it.id)}" aria-label="${tx("Изменить")} ${esc(it.name)}">${icon('edit','ic--sm')}</button><button class="ibtn ibtn--danger" data-act="gloss-delete" data-id="${esc(it.id)}" aria-label="${tx("Удалить")} ${esc(it.name)}">${icon('trash','ic--sm')}</button></span></li>`;}).join('');
  return appbar(sq('home','back',tx("Все смены"),'','sq--ghost'),'')
    +`<h1>${tx("Справочник")}</h1>
    <p class="lead">${tx("Эти значения выбираются из списка при создании смены и бланка машины. Новое значение можно добавить и прямо в форме.")}</p>
    <div class="tabs" role="tablist" aria-label="${tx("Разделы справочника")}">${tabs}</div>
    <div class="addrow">
      <input class="inp${cat.id==='vehicles'?' mono':''}" id="gnew" placeholder="${esc(cat.ph)}" value="${esc(S.drafts['g-'+cat.id]||'')}" data-draft="g-${cat.id}" data-enter="gloss-add" autocomplete="off" aria-label="${tx("Новое значение, раздел")} ${esc(cat.label)}">
      <button class="btn btn--primary" data-act="gloss-add">${tx("Добавить")}</button>
    </div>
    ${items.length>=8?`<div class="filter"><input class="inp" id="gfilter" type="search" placeholder="${tx("Найти в разделе")}" value="${esc(S.gfilter)}" data-gfilter="1" autocomplete="off" aria-label="${tx("Поиск в разделе")}"></div>`:''}
    ${shown.length?`<ul class="glist">${lis}</ul>`:`<div class="empty"><p>${items.length?tx("Ничего не найдено."):tx("В этом разделе пока пусто. Добавьте первое значение выше.")}</p></div>`}
    ${miss.length?`<div class="hint"><span>${tx('В сменах есть значения, которых нет в справочнике: {k}.',{k:miss.length})}</span><button class="btn btn--sm" data-act="gloss-import">${tx("Добавить из смен")}</button></div>`:''}`;
}

function setLang(l){
  if(l!=='kk'&&l!=='ru')return;
  LANG=l;try{localStorage.setItem(LKEY,l);}catch(_){}
  try{document.documentElement.lang=l;}catch(_){}
  render();window.scrollTo(0,0);
}
function render(){
  const ae=document.activeElement;let aid=null,sel=null;
  if(ae&&ae!==document.body&&$app.contains(ae)&&ae.id){aid=ae.id;try{if(ae.selectionStart!=null)sel=[ae.selectionStart,ae.selectionEnd];}catch(_){}}
  if(!LANG){$app.innerHTML=viewLang();return;}
  let html;
  if(!isReady()){html=tx("<p class=\"lead\" style=\"margin-top:24px\">Загружаю данные…</p>");}
  else{
    const sh=S.shifts[S.shiftId];
    if(S.view==='car'&&sh&&sh.cars.some(c=>c.id===S.carId)){html=viewCar(sh,sh.cars.find(c=>c.id===S.carId));}
    else if((S.view==='car'||S.view==='shift')&&sh){
      if(S.view==='car'){S.view='shift';S.carId=null;try{location.hash='shift-'+sh.id;}catch(_){}}
      html=viewShift(sh);
    }
    else if(S.view==='glossary'){html=viewGlossary();}
    else if(S.view==='stats'){html=viewStats();}
    else if(S.view==='settings'){html=viewSettings();}
    else{
      if(S.view!=='home'){S.view='home';S.shiftId=null;S.carId=null;try{location.hash='';}catch(_){}}
      html=viewHome();
    }
  }
  $app.innerHTML=html;
  labelTables();
  if(S.focusId){const el=document.getElementById(S.focusId);if(el)el.focus();S.focusId=null;}
  else if(aid){const el=document.getElementById(aid);if(el){el.focus({preventScroll:true});if(sel){try{el.setSelectionRange(sel[0],sel[1]);}catch(_){}}}}
  if(S.scrollId){const el=document.getElementById(S.scrollId);if(el)el.scrollIntoView({block:'nearest'});S.scrollId=null;}
}
function labelTables(){
  $app.querySelectorAll('table.tbl--stack').forEach(t=>{
    const hs=[...t.querySelectorAll('thead th')].map(h=>h.textContent.trim());
    t.querySelectorAll('tbody tr,tfoot tr').forEach(r=>{let c=0;[...r.children].forEach(td=>{const span=td.colSpan||1;td.setAttribute('data-l',span>1?'':(hs[c]||''));c+=span;});});
  });
}
function updatePreview(){
  const car=currentCar(),el=document.getElementById('w-calc'),inp=document.getElementById('w-gross'),btn=document.getElementById('w-add');
  if(!car||!el||!inp)return;
  el.innerHTML=calcHtml(car,inp.value);
  const g=parseNum(inp.value);
  if(btn)btn.classList.toggle('is-idle',isNaN(g)||g<=0);
}

/* ---------- toast & modal ---------- */
let toastTimer=null;
function toast(msg,kind){
  $toast.textContent=msg;$toast.className='toast'+(kind==='err'?' is-err':'');$toast.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{$toast.hidden=true;},kind==='err'?5000:3000);
}
function showModal(html,st){
  st.opener=document.activeElement;S.modal=st;
  $modal.innerHTML=html;document.body.classList.add('modal-open');
  const first=$modal.querySelector(st.focus||'input:not([hidden]):not([type=hidden]):not([type=radio]),select,textarea,button');
  if(first)first.focus();
}
function closeModal(){
  const st=S.modal;S.modal=null;$modal.innerHTML='';document.body.classList.remove('modal-open');
  if(st&&st.opener&&st.opener.isConnected&&st.opener.focus)try{st.opener.focus({preventScroll:true});}catch(_){}
}
function pickHtml(f){
  const items=S.glossary[f.pick].map(x=>x.name).sort((a,b)=>a.localeCompare(b,'ru'));
  const cur=f.value||'';
  const hasCur=cur&&items.some(n=>sameName(n,cur));
  const opts=[tx("<option value=\"\">Выберите из списка…</option>")]
    .concat(items.map(n=>`<option value="${esc(n)}"${sameName(n,cur)?' selected':''}>${esc(n)}</option>`));
  if(cur&&!hasCur)opts.push(`<option value="${esc(cur)}" selected>${esc(cur)} ${tx("(нет в справочнике)")}</option>`);
  opts.push(tx("<option value=\"__new__\">+ Добавить новый…</option>"));
  return `<div class="field${f.half?' field--half':''}"><div class="field__lbl"><label for="f-${f.name}">${esc(f.label)}</label><button type="button" class="linkbtn" data-addnew="${f.name}">+ ${esc(f.addLabel||tx("Добавить"))}</button></div>
    <select class="inp" id="f-${f.name}" name="${f.name}" data-pick="${f.pick}">${opts.join('')}</select>
    <input class="inp" id="f-${f.name}__new" name="${f.name}__new" placeholder="${esc(f.placeholder||tx("Новое значение"))}" autocomplete="off" hidden>
    ${items.length?'':tx("<p class=\"fhint\">Справочник пока пуст. Нажмите «Добавить», и значение сохранится в справочнике.</p>")}
    <p class="err" data-err="${f.name}" hidden></p></div>`;
}
function fieldHtml(f){
  if(f.pick)return pickHtml(f);
  if(f.colors)return `<div class="field"><span class="lbl" id="lbl-${f.name}">${esc(f.label)}</span>
    <div class="sws" role="radiogroup" aria-labelledby="lbl-${f.name}">${COLORS.map(k=>`<label class="sw" title="${k.name}" style="--c:${k.hex}"><input type="radio" name="${f.name}" value="${k.id}"${k.id===f.value?' checked':''} aria-label="${k.name}"><span></span></label>`).join('')}</div>
    <p class="err" data-err="${f.name}" hidden></p></div>`;
  if(f.options)return `<div class="field${f.half?' field--half':''}"><label for="f-${f.name}">${esc(f.label)}</label>
    <select class="inp" id="f-${f.name}" name="${f.name}">${f.options.map(o=>`<option value="${esc(o[0])}"${o[0]===f.value?' selected':''}>${esc(o[1])}</option>`).join('')}</select>
    <p class="err" data-err="${f.name}" hidden></p></div>`;
  return `<div class="field${f.half?' field--half':''}"><label for="f-${f.name}">${esc(f.label)}</label>
    <input class="inp" id="f-${f.name}" name="${f.name}" type="${f.type==='time'?'text':(f.type||'text')}"${f.type==='time'?tx(" inputmode=\"numeric\" maxlength=\"5\" placeholder=\"ЧЧ:ММ\" data-time=\"1\""):''}${f.inputmode?` inputmode="${f.inputmode}"`:''}${f.list?` list="${f.list}"`:''}${f.placeholder?` placeholder="${esc(f.placeholder)}"`:''} value="${esc(f.value)}" autocomplete="off">
    <p class="err" data-err="${f.name}" hidden></p></div>`;
}
function openForm(o){
  const html=`<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <h2 id="dlg-title" class="dlg-title">${esc(o.title)}</h2>
    <form id="dlg-form" novalidate autocomplete="off"><div class="fields">${o.fields.map(fieldHtml).join('')}</div>${o.extra||''}${o.extra2||''}
    <div class="dlg-actions">${o.onDelete?tx("<button type=\"button\" class=\"btn btn--ghost btn--danger dlg-del\" data-act=\"modal-delete\">Удалить</button>"):''}<button type="button" class="btn" data-act="modal-close">${tx("Отмена")}</button><button type="submit" class="btn btn--primary">${esc(o.submitLabel||tx("Сохранить"))}</button></div></form></div></div>`;
  showModal(html,{onDelete:o.onDelete,autofill:o.autofill,submit(form){
    const v={},isNew={};
    o.fields.forEach(f=>{
      if(f.pick){
        const sel=form.elements[f.name].value;
        if(sel==='__new__'){v[f.name]=cleanName(f.pick,form.elements[f.name+'__new'].value);isNew[f.name]=true;}
        else v[f.name]=sel;
      }else v[f.name]=String(form.elements[f.name].value||'').trim();
    });
    let firstBad=null;
    o.fields.forEach(f=>{
      const er=form.querySelector('[data-err="'+f.name+'"]');
      const el=f.pick&&isNew[f.name]?form.elements[f.name+'__new']:form.elements[f.name];
      let msg='';
      if(f.required&&!v[f.name])msg=f.pick?(isNew[f.name]?tx("Введите значение"):tx("Выберите значение из списка")):tx("Заполните это поле");
      else if(f.check&&v[f.name])msg=f.check(v)||'';
      if(er){er.textContent=msg;er.hidden=!msg;}
      if(el&&el.setAttribute)el.setAttribute('aria-invalid',msg?'true':'false');
      if(msg&&!firstBad)firstBad=el;
    });
    if(firstBad){if(firstBad.focus)firstBad.focus();return;}
    o.fields.forEach(f=>{if(f.pick&&isNew[f.name])v[f.name]=glossAdd(f.pick,v[f.name]);});
    closeModal();o.onSave(v);
  }});
}

    <h2 id="dlg-title" class="dlg-title">${esc(o.title)}</h2><p id="dlg-text" class="dlg-text">${esc(o.text)}</p>
    <div class="dlg-actions"><button type="button" class="btn" id="dlg-cancel" data-act="modal-close">${tx("Отмена")}</button><button type="button" class="btn ${o.safe?'btn--primary':'btn--solid-danger'}" data-act="modal-confirm">${esc(o.confirmLabel||tx("Удалить"))}</button></div></div></div>`;

}

function showNewInput(name){
  const sel=document.getElementById('f-'+name),ni=document.getElementById('f-'+name+'__new');
  if(!sel||!ni)return;

}
function autofillCar(form,car){
  const tare=form.elements.tare;if(tare&&!tare.value.trim())tare.value=car.tare;
  [['driver',car.driver],['route',car.route],['material',car.material]].forEach(([n,val])=>{
    const sel=form.elements[n];
    if(sel&&!sel.value&&[...sel.options].some(o=>o.value===val))sel.value=val;
  });
  const r=[...form.querySelectorAll('input[name="color"]')].find(x=>x.value===car.color);if(r)r.checked=true;
  const nt=document.getElementById('af-note');
  if(nt){nt.textContent=tx("Данные подставлены из последней записи по этому номеру. Проверьте и измените при необходимости.");nt.hidden=false;}
}

    title:sh?tx("Изменить смену"):(src?tx("Копия смены"):tx("Новая смена")),
    submitLabel:sh?tx("Сохранить"):(src?tx("Создать копию"):tx("Создать смену")),
    extra:src?tx("<p class=\"dlg-note\">Машины скопируются без рейсов. Время прибытия, тару и водителей можно поправить в каждой машине.</p>"):'',
    fields:[
      {name:'date',label:tx("Дата"),type:'date',required:true,value:sh?sh.date:todayISO(),half:true},
      {name:'type',label:tx("Смена"),options:[['day',tx("1-дневная")],['night',tx("2-ночная")]],value:sh?sh.type:(src?src.type:autoType()),half:true},
      {name:'operator',label:tx("Оператор автовесов"),pick:'operators',addLabel:tx("Новый оператор"),required:true,value:sh?sh.operator:(src?src.operator:lastOperator()),placeholder:tx("Фамилия Имя Отчество")},
      {name:'status',label:tx("Статус"),options:[['active',tx("Активна")],['closed',tx("Закрыта")]],value:sh?sh.status:'active'}
    ],
    onDelete:sh?()=>handle('shift-delete',{dataset:{id:sh.id}}):null,
    onSave(v){

/* ---------- navigation ---------- */
function parseHash(){
  const h=location.hash;let m;
  if((m=/^#car-([a-z0-9]+)-([a-z0-9]+)$/.exec(h)))return{view:'car',shiftId:m[1],carId:m[2]};
  if((m=/^#shift-([a-z0-9]+)$/.exec(h)))return{view:'shift',shiftId:m[1]};
  if(h==='#stats')return{view:'stats'};
  if(h==='#settings')return{view:'settings'};
  if((m=/^#glossary(?:-([a-z]+))?$/.exec(h)))return{view:'glossary',gcat:CATS.some(c=>c.id===m[1])?m[1]:null};
  return{view:'home'};
}
function applyRoute(r){S.view=r.view;S.shiftId=r.shiftId||null;S.carId=r.carId||null;if(r.gcat)S.gcat=r.gcat;}
function navigate(view,a,b){
  let hash='';
  if(view==='shift'){if(S.shiftId!==a)S.carQuery='';S.view='shift';S.shiftId=a;S.carId=null;hash='shift-'+a;}
  else if(view==='car'){S.view='car';S.shiftId=a;S.carId=b;hash='car-'+a+'-'+b;}
  else if(view==='glossary'){S.view='glossary';S.shiftId=null;S.carId=null;if(a){S.gcat=a;S.gfilter='';}hash='glossary-'+S.gcat;}
  else if(view==='settings'){S.view='settings';S.shiftId=null;S.carId=null;hash='settings';}
  else if(view==='stats'){S.view='stats';S.shiftId=null;S.carId=null;hash='stats';}
  else{S.view='home';S.shiftId=null;S.carId=null;}
  try{location.hash=hash;}catch(_){}
  render();window.scrollTo(0,0);
}

/* ---------- actions ---------- */
function addTrip(carId){
  const sh=S.shifts[S.shiftId];if(!sh)return;
  const car=sh.cars.find(c=>c.id===carId);if(!car)return;
  const g=parseNum(S.drafts[carId]);
  if(isNaN(g)||g<=0){toast(tx("Введите вес брутто числом, например 41250"),'err');const el=document.getElementById('w-gross');if(el)el.focus();return;}
  const tv=S.drafts['t-'+carId];
  let time=nowHM();
  if(tv){time=normTime(tv);if(!time){toast(tx("Введите время цифрами, например 14:35"),'err');const el=document.getElementById('w-time');if(el)el.focus();return;}}
  const ref=g>=car.tare?grossAnomaly(car,g):0;
  if(ref){
    openConfirm({title:tx('Проверьте вес'),confirmLabel:tx('Записать'),safe:true,
      text:tx('Обычно около {r} кг, а вы ввели {g} кг. Записать рейс?',{r:fmt(ref,0),g:fmt(g,0)}),
      onConfirm(){commitTrip(carId,g,time);}});
    return;
  }
  commitTrip(carId,g,time);
}
function commitTrip(carId,g,time){
  const sh=S.shifts[S.shiftId];if(!sh)return;
  const car=sh.cars.find(c=>c.id===carId);if(!car)return;
  S.drafts[carId]='';delete S.drafts['t-'+carId];S.focusId='w-gross';
  mutateShift(sh.id,s=>{s.cars.find(c=>c.id===carId).trips.push({id:uid('t'),time,gross:g});});
  if(g<car.tare)toast(tx("Брутто меньше тары. Проверьте вес."),'err');
  else toast(tx("Рейс записан: нетто ")+fmt(r2(g-car.tare))+tx(" кг"));
}
function setRange(kind){
  const d=new Date();
  if(kind==='all'){S.sFrom='';S.sTo='';}
  else if(kind==='week'){const f=new Date(d.getFullYear(),d.getMonth(),d.getDate()-6);S.sFrom=f.getFullYear()+'-'+pad(f.getMonth()+1)+'-'+pad(f.getDate());S.sTo=todayISO();}
  else{S.sFrom=monthStart();S.sTo='';}
  render();
}
function handle(act,b){
  const sh=S.shifts[S.shiftId];
  switch(act){
    case 'home':navigate('home');break;
    case 'htype':S.homeType=b.dataset.type==='night'?'night':'day';render();break;
    case 'theme':{
      S.theme=S.theme==='light'?'dark':S.theme==='dark'?'auto':'light';
      try{localStorage.setItem(TKEY,S.theme);}catch(_){}
      applyTheme();render();toast(tx("Тема: ")+THEME_NAME[S.theme]);break;}
    case 'shift-copy':if(sh)openShiftForm(null,sh.id);break;
    case 'glossary':navigate('glossary');break;
    case 'stats':navigate('stats');break;
    case 'settings':navigate('settings');break;
    case 'setlang':setLang(b.dataset.lang);break;
    case 'settheme':{const v=b.dataset.theme;if(v==='light'||v==='dark'||v==='auto'){S.theme=v;try{localStorage.setItem(TKEY,v);}catch(_){}applyTheme();render();}break;}
    case 'range':setRange(b.dataset.range);break;
    case 'entity-report':{
      const list=periodShifts(),E=entCurrent(list);if(!E.name)break;
      const sub=(E.kind==='route'?tx('Маршрут'):tx('Водитель'))+': '+E.name+' · '+(S.sFrom?dateRu(S.sFrom):tx('начало'))+' — '+(S.sTo?dateRu(S.sTo):tx('сегодня'));
      openExport({sub,base:safeName(tx('Отчёт_')+E.name+'_'+(S.sFrom||'')+'_'+(S.sTo||todayISO())),doc:()=>entityDoc(list,E.kind,E.name),csv:()=>docToCsv(entityDoc(list,E.kind,E.name))});
      break;}
    case 'stats-report':{
      const list=periodShifts();
      openExport({sub:tx("Сводка за период: ")+(S.sFrom?dateRu(S.sFrom):tx("начало"))+' — '+(S.sTo?dateRu(S.sTo):tx("сегодня")),
        base:safeName(tx("Сводка_")+(S.sFrom||tx("начало"))+'_'+(S.sTo||todayISO())),doc:()=>periodDoc(list),csv:()=>periodCsv(list)});
      break;}
    case 'backup':saveFile('avtovesy_backup_'+todayISO()+'.json',JSON.stringify({exportedAt:new Date().toISOString(),shifts:Object.values(S.shifts).sort(newestFirst),glossary:S.glossary},null,2),false);break;
    case 'gtab':navigate('glossary',b.dataset.cat);break;
    case 'open':navigate('shift',b.dataset.id);break;

    case 'shift-delete':{

      openConfirm({title:tx("Удалить смену?"),confirmLabel:tx("Удалить смену"),
        text:tx('Смена «{n}» за {d} будет удалена вместе с машинами ({c}) и рейсами ({r}). Это действие нельзя отменить.',{n:shiftName(s),d:dateLong(s.date),c:t.cars,r:t.trips}),
        onConfirm(){delete S.shifts[s.id];persistDelete(s.id);if(S.shiftId===s.id)navigate('home');else render();toast(tx("Смена удалена"));}});
      break;}
    case 'car-new':openCarForm(null);break;
    case 'car-edit':openCarForm(b.dataset.car);break;
    case 'cars-copy':{
      if(!sh)break;const prev=prevShift(sh);if(!prev)break;
      const fresh=prev.cars.filter(c=>!sh.cars.some(x=>sameName(x.plate,c.plate)));
      if(!fresh.length){toast(tx("Все машины из прошлой смены уже добавлены"),'err');break;}
      openConfirm({title:tx("Копировать машины?"),confirmLabel:tx("Копировать"),safe:true,
        text:tx('Из смены «{n}» за {d} будет добавлено машин: {k}. Копируются номер, водитель, маршрут, материал, тара и цвет. Рейсы не копируются, время прибытия ставится текущее.',{n:shiftName(prev),d:dateLong(prev.date),k:fresh.length}),
        onConfirm(){const t=nowHM();mutateShift(sh.id,s=>{fresh.forEach(c=>s.cars.push({id:uid('c'),plate:c.plate,driver:c.driver,route:c.route,material:c.material,tare:c.tare,color:c.color,arrival:t,trips:[]}));});toast(tx("Добавлено машин: ")+fresh.length);}});
      break;}
    case 'car-delete':{
      if(!sh)break;const c=sh.cars.find(x=>x.id===b.dataset.car);if(!c)break;
      openConfirm({title:tx("Удалить машину?"),confirmLabel:tx("Удалить машину"),
        text:tx('Бланк {p} ({d}) будет удалён вместе с рейсами: {k}. Это действие нельзя отменить.',{p:c.plate,d:c.driver,k:c.trips.length}),
        onConfirm(){navigate('shift',sh.id);mutateShift(sh.id,s=>{s.cars=s.cars.filter(x=>x.id!==c.id);});toast(tx("Машина удалена"));}});
      break;}

      const tid=b.dataset.trip;
      openConfirm({title:tx("Удалить рейс?"),confirmLabel:tx("Удалить рейс"),

      break;}
    case 'car-report':{
      if(!sh)break;const c=sh.cars.find(x=>x.id===b.dataset.car);if(!c)break;
      openExport({sub:tx("Машина ")+c.plate+' · '+dateRu(sh.date)+' · '+shiftName(sh),base:safeName(tx("Отчёт_")+c.plate+'_'+sh.date+'_'+shiftName(sh)),doc:()=>carDoc(sh,c),csv:()=>carReportCsv(sh,c)});break;}
    case 'shift-report':
      if(sh)openExport({sub:tx("Общий расчёт за смену: ")+dateRu(sh.date)+' · '+shiftName(sh),base:safeName(tx("Общий-расчёт_")+sh.date+'_'+shiftName(sh)),doc:()=>shiftDoc(sh),csv:()=>shiftReportCsv(sh)});break;
    case 'gloss-add':{
      const key='g-'+S.gcat,name=cleanName(S.gcat,S.drafts[key]);
      if(!name){toast(tx("Введите значение"),'err');const el=document.getElementById('gnew');if(el)el.focus();break;}
      if(glossFind(S.gcat,name)){toast(tx("Такое значение уже есть"),'err');break;}
      glossAdd(S.gcat,name);S.drafts[key]='';S.gfilter='';S.focusId='gnew';render();toast(tx("Добавлено: ")+name);
      break;}
    case 'gloss-edit':openGlossEdit(S.gcat,b.dataset.id);break;
    case 'gloss-delete':{
      const it=S.glossary[S.gcat].find(x=>x.id===b.dataset.id);if(!it)break;
      const cat=S.gcat,n=usageCount(cat,it.name);

        text:tx('«{n}» будет удалено из справочника.',{n:it.name})+(n?' '+tx('Значение используется в сменах ({k}), там оно останется без изменений.',{k:n}):''),

      break;}
    case 'gloss-import':{
      const miss=missingFromShifts();if(!miss.length)break;
      miss.forEach(m=>S.glossary[m.cat].push({id:uid('g'),name:m.name}));
      persistGlossary();render();toast(tx("Добавлено значений: ")+miss.length);
      break;}
  }
}

$modal.addEventListener('change',e=>{

$modal.addEventListener('submit',e=>{e.preventDefault();if(S.modal&&S.modal.submit)S.modal.submit(e.target);});
$modal.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.time!=null)t.value=fmtTimeLive(t.value);});
document.addEventListener('focusout',e=>{
  const t=e.target;if(!t||!t.dataset||t.dataset.time==null)return;
  const n=normTime(t.value);
  if(n){t.value=n;if(t.dataset.draft!=null)S.drafts[t.dataset.draft]=n;}
});
document.addEventListener('keydown',e=>{
  if(!S.modal)return;
  if(e.key==='Escape'){e.preventDefault();closeModal();return;}
  if(e.key==='Tab'){
    const f=[...$modal.querySelectorAll('input,select,textarea,button')].filter(x=>!x.disabled&&x.offsetParent!==null);
    if(!f.length)return;
    const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }
});
window.addEventListener('hashchange',()=>{

  if(!same){closeModal();applyRoute(r);render();window.scrollTo(0,0);}
});

/* ---------- Android (Capacitor): сохранение файлов через меню «Поделиться» ---------- */
function nativeDownloads(){
  const C=window.Capacitor;
  if(!C||!C.isNativePlatform||!C.isNativePlatform())return null;
  const P=C.Plugins||{};if(!P.Filesystem||!P.Share)return null;
  const toB64=async d=>{
    if(typeof d==='string')d=new TextEncoder().encode(d);
    else if(d instanceof Blob)d=new Uint8Array(await d.arrayBuffer());
    else if(d instanceof ArrayBuffer)d=new Uint8Array(d);
    let bin='';for(let i=0;i<d.length;i+=0x8000)bin+=String.fromCharCode.apply(null,d.subarray(i,i+0x8000));
    return btoa(bin);
  };
  return {async save({filename,data}){
    try{
      const w=await P.Filesystem.writeFile({path:filename,data:await toB64(data),directory:'CACHE'});
      await P.Share.share({title:filename,files:[w.uri],dialogTitle:'Сохранить или отправить файл'});
      return {status:'saved'};
    }catch(e){
      const m=String(e&&e.message||e).toLowerCase();
      if(m.includes('cancel')||m.includes('dismiss'))throw {code:'declined'};
      throw {code:'unavailable',message:String(e&&e.message||e)};
    }
  }};
}
async function init(){
  applyTheme();
  applyRoute(parseHash());
  render();
  const c=window.claude;
  let db=null,dl=null;
  if(c&&c.use){
    const r=await Promise.all([c.use('db').catch(()=>null),c.use('downloads').catch(()=>null)]);
    db=r[0];dl=r[1];
  }
  S.downloads=dl||nativeDownloads();
  if(!db){fallbackLocal();return;}
  S.db=db;S.mode='db';
  const fail=()=>{toast(tx("Нет связи с хранилищем данных"),'err');S.gotShifts=true;S.gotGloss=true;render();};
  try{
    db.collection('shifts').onSnapshot(onSnap,fail);
    db.doc('glossary/main').onSnapshot(onGlossSnap,fail);
  }catch(e){fallbackLocal();}
}
init();
})();
</script>
